name: Deploy Fireworks Show Simulator to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static files
        run: |
          mkdir site
          cp index.html site/
          cp index-old.html site/
          cp privacy.html site/
          cp script.js site/
          cp styles.css site/
          cp -r data site/
          cp CNAME site/
          cp .nojekyll site/
          cp favicon.ico site/
          cp apple-touch-icon.png site/
          cp apple-touch-icon-precomposed.png site/
          cp -r assets site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      - name: Prepare notification
        shell: python
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          import html
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          message = (event.get("head_commit") or {}).get("message", "")
          lines = [line.strip() for line in message.splitlines() if line.strip()]
          title = lines[0] if lines else "Manual deployment"
          if title.startswith("Merge pull request #") and len(lines) > 1:
              title = lines[1]

          escape = html.escape
          sha = os.environ["GITHUB_SHA"]
          repository = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repository}"
          result = {
              "success": "SUCCESS", "failure": "FAILED",
              "cancelled": "CANCELLED", "skipped": "SKIPPED",
          }.get(os.environ["DEPLOY_RESULT"], "UNKNOWN")
          text = (
              "<b>FIREWORKS SHOW SIMULATOR</b>\n"
              f"Website Deployment | <b>{result}</b>\n\n"
              "<b>Website:</b> fireworksshowsimulator.com\n"
              f"<b>Branch:</b> <code>{escape(os.environ['GITHUB_REF_NAME'])}</code>\n"
              f"<b>Commit:</b> <code>{escape(sha[:8])}</code>\n"
              f"<b>Change:</b> {escape(title[:200])}\n"
              f"<b>Run:</b> #{escape(os.environ['GITHUB_RUN_NUMBER'])}\n\n"
              '<a href="https://fireworksshowsimulator.com">Open Website</a> | '
              f'<a href="{escape(base)}/actions/runs/{escape(os.environ["GITHUB_RUN_ID"])}">View Deployment</a>'
          )
          # The action runs envsubst; preserve literal dollar signs in commit titles.
          Path("telegram-notification.html").write_text(text.replace("$", "&#36;"))

      - name: Notify Telegram
        uses: up9cloud/action-notify@v0.4
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEMPLATE_PATH: /github/workspace/telegram-notification.html
          TELEGRAM_PARSE_MODE: HTML
