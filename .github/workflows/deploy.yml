name: Deploy Fireworks Show Simulator to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static files
        run: |
          mkdir site
          cp index.html site/
          cp index-old.html site/
          cp privacy.html site/
          cp script.js site/
          cp styles.css site/
          cp -r data site/
          cp CNAME site/
          cp .nojekyll site/
          cp favicon.ico site/
          cp apple-touch-icon.png site/
          cp apple-touch-icon-precomposed.png site/
          cp -r assets site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      - name: Prepare notification
        id: info
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        uses: up9cloud/action-notify@v0.4
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: |
            *FIREWORKS SHOW SIMULATOR - DEPLOY*

            *Result:* `${{ needs.deploy.result == 'success' && 'SUCCESS' || (needs.deploy.result == 'failure' && 'FAILED' || (needs.deploy.result == 'cancelled' && 'CANCELLED' || 'SKIPPED')) }}`
            *Repository:* `${{ github.repository }}`
            *Branch:* `${{ github.head_ref || github.ref_name }}`
            *Commit:* [`${{ steps.info.outputs.short_sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            *Workflow:* `${{ github.workflow }}`
            *Triggered by:* `${{ github.actor }}`

            [Open website](https://fireworksshowsimulator.com)
            [Open workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
